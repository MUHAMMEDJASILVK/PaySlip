
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

</style>

</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <input type="text"
    id="username"
    placeholder="Enter Username">

    <input type="password"
    id="password"
    placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>

</div>

<script>

function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;





    // DEMO LOGIN

    if(
        username === "admin"
        &&
        password === "1234"
    ){

        localStorage.setItem(
            "isLoggedIn",
            "true"
        );

        window.location.href =
        "index.html";
    }

    else{

        alert("Invalid Username or Password");
    }
}

</script>

</body>

</html>
